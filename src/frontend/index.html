<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Tile Interceptor</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="map">
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>
  </div>

  <div id="vibe-picker"></div>
  <div id="poi-panel"></div>

  <div id="compass" aria-label="Compass">
    <svg id="compass-svg" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">

      <!-- Default: slim 4-point diamond — used by default, dark, noir, vintage,
           toner, watercolor, highcontrast, blueprint -->
      <g class="compass-default" fill="currentColor">
        <polygon points="0,-44 -8,-4 0,-14 8,-4"/>
        <polygon points="0,44 -8,4 0,14 8,4" opacity="0.35"/>
        <polygon points="44,0 4,-8 14,0 4,8" opacity="0.5"/>
        <polygon points="-44,0 -4,-8 -14,0 -4,8" opacity="0.5"/>
        <circle cx="0" cy="0" r="3"/>
      </g>

      <!-- Mario: chunky pixel-art rect arrows, gold accent -->
      <g class="compass-mario" fill="currentColor" stroke="currentColor" stroke-width="0.5">
        <rect x="-3" y="-42" width="6" height="7"/>
        <rect x="-6" y="-35" width="12" height="7"/>
        <rect x="-9" y="-28" width="18" height="6"/>
        <rect x="-3" y="29" width="6" height="7" opacity="0.5"/>
        <rect x="-6" y="22" width="12" height="7" opacity="0.5"/>
        <rect x="25" y="-3" width="14" height="6" opacity="0.5"/>
        <rect x="-39" y="-3" width="14" height="6" opacity="0.5"/>
        <rect x="-5" y="-5" width="10" height="10"/>
      </g>

      <!-- Tomclancy: targeting reticle with broken crosshair -->
      <g class="compass-tomclancy" fill="none" stroke="#00ff41" stroke-width="1.5">
        <circle cx="0" cy="0" r="36"/>
        <line x1="0" y1="-36" x2="0" y2="-22"/>
        <line x1="0" y1="10" x2="0" y2="36"/>
        <line x1="-36" y1="0" x2="-10" y2="0"/>
        <line x1="10" y1="0" x2="36" y2="0"/>
        <circle cx="0" cy="0" r="9"/>
        <circle cx="0" cy="0" r="2" fill="#00ff41" stroke="none"/>
        <line x1="0" y1="-45" x2="0" y2="-38"/>
        <line x1="0" y1="38" x2="0" y2="45"/>
        <line x1="-45" y1="0" x2="-38" y2="0"/>
        <line x1="38" y1="0" x2="45" y2="0"/>
      </g>

      <!-- Deco: 8-point geometric rose with outer tick ring -->
      <g class="compass-deco" fill="#c8a050" stroke="#c8a050" stroke-width="0.5">
        <polygon points="0,-45 -6,-8 0,-16 6,-8"/>
        <polygon points="0,45 -6,8 0,16 6,8" opacity="0.6"/>
        <polygon points="-45,0 -8,-6 -16,0 -8,6" opacity="0.7"/>
        <polygon points="45,0 8,-6 16,0 8,6" opacity="0.7"/>
        <polygon points="0,-30 -5,-5 0,-12 5,-5" transform="rotate(45)"  opacity="0.5"/>
        <polygon points="0,-30 -5,-5 0,-12 5,-5" transform="rotate(135)" opacity="0.5"/>
        <polygon points="0,-30 -5,-5 0,-12 5,-5" transform="rotate(225)" opacity="0.5"/>
        <polygon points="0,-30 -5,-5 0,-12 5,-5" transform="rotate(315)" opacity="0.5"/>
        <circle cx="0" cy="0" r="40" fill="none" stroke-dasharray="2,5"/>
        <circle cx="0" cy="0" r="4" stroke="none"/>
      </g>

      <!-- Metro: organic 4-point arrow with circle dots at cardinal ends -->
      <g class="compass-metro" fill="#c4a86a">
        <polygon points="0,-44 -7,-6 0,-14 7,-6"/>
        <circle cx="0" cy="-44" r="2.5"/>
        <polygon points="0,44 -7,6 0,14 7,6" opacity="0.4"/>
        <circle cx="0" cy="44" r="2" opacity="0.4"/>
        <polygon points="44,0 6,-7 14,0 6,7" opacity="0.5"/>
        <circle cx="44" cy="0" r="2" opacity="0.5"/>
        <polygon points="-44,0 -6,-7 -14,0 -6,7" opacity="0.5"/>
        <circle cx="-44" cy="0" r="2" opacity="0.5"/>
        <circle cx="0" cy="0" r="3.5"/>
      </g>

      <!-- Mockva: bold 8-point star, red N point -->
      <g class="compass-mockva">
        <polygon points="0,-45 -9,0 9,0" fill="#cc1111"/>
        <polygon points="0,45 -9,0 9,0" fill="#e8e0d0" opacity="0.8"/>
        <polygon points="45,0 0,-9 0,9" fill="#e8e0d0" opacity="0.8"/>
        <polygon points="-45,0 0,-9 0,9" fill="#e8e0d0" opacity="0.8"/>
        <polygon points="0,-32 -6,-6 6,-6" transform="rotate(45)"  fill="#e8e0d0" opacity="0.6"/>
        <polygon points="0,-32 -6,-6 6,-6" transform="rotate(135)" fill="#e8e0d0" opacity="0.6"/>
        <polygon points="0,-32 -6,-6 6,-6" transform="rotate(225)" fill="#e8e0d0" opacity="0.6"/>
        <polygon points="0,-32 -6,-6 6,-6" transform="rotate(315)" fill="#e8e0d0" opacity="0.6"/>
        <circle cx="0" cy="0" r="5" fill="#cc1111"/>
      </g>

      <!-- Simcity: minimal circle with cardinal ticks -->
      <g class="compass-simcity" fill="none" stroke="#a0a090" stroke-width="1.5">
        <circle cx="0" cy="0" r="30"/>
        <line x1="0" y1="-30" x2="0" y2="-24"/>
        <line x1="0" y1="24" x2="0" y2="30"/>
        <line x1="-30" y1="0" x2="-24" y2="0"/>
        <line x1="24" y1="0" x2="30" y2="0"/>
      </g>

    </svg>
    <div id="compass-n">N</div>
  </div>

  <div id="scale-bar">
    <div id="scale-line"></div>
    <div id="scale-label"></div>
  </div>

  <!-- ── Report issue modal ──────────────────────────────────────── -->
  <div id="report-modal" style="display:none; position:fixed; inset:0; z-index:9000; background:rgba(5,10,20,0.9); backdrop-filter:blur(10px); align-items:center; justify-content:center;">
    <div style="background:var(--ui-bg,rgba(5,10,20,0.95)); border:1px solid var(--ui-border,rgba(255,255,255,0.12)); border-radius:12px; width:min(500px,92vw); max-height:88vh; overflow-y:auto; box-shadow:0 16px 64px rgba(0,0,0,0.8); font-family:var(--ui-font,'Courier New',monospace);">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 22px 14px; border-bottom:1px solid var(--ui-border,rgba(255,255,255,0.12)); position:sticky; top:0; background:var(--ui-bg,rgba(5,10,20,0.95)); z-index:2;">
        <div>
          <div style="font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ui-color-dim,rgba(200,210,230,0.55)); margin-bottom:4px;">Report an issue</div>
          <div style="font-size:1rem; font-weight:700; color:var(--ui-color-active,#dde4f0); line-height:1.2;">Tell me what's broken</div>
          <div style="font-size:0.6rem; color:var(--ui-color-dim,rgba(200,210,230,0.55)); margin-top:3px;">Posts to the GitHub repo. A nightly agent triages and proposes fixes.</div>
        </div>
        <button id="report-close" style="background:transparent; border:none; color:var(--ui-color-dim,rgba(200,210,230,0.55)); font-size:13px; cursor:pointer; padding:4px; flex-shrink:0; line-height:1; font-family:inherit;">✕</button>
      </div>
      <div style="padding:18px 22px; display:flex; flex-direction:column; gap:8px;">
        <label for="report-text" style="font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ui-color-dim,rgba(200,210,230,0.55));">What went wrong, or what would make this better?</label>
        <textarea id="report-text" rows="6" style="width:100%; margin-top:4px; padding:9px 11px; background:rgba(255,255,255,0.04); color:var(--ui-color-active,#dde4f0); border:1px solid var(--ui-border,rgba(255,255,255,0.12)); border-radius:var(--ui-radius,6px); font-family:inherit; font-size:0.65rem; line-height:1.6; resize:vertical; min-height:100px; outline:none;" placeholder="e.g. The noir vibe tile colours look washed out. Or: the vibe picker doesn't show after switching styles. Or: raster tiles aren't loading…" onfocus="this.style.borderColor='var(--ui-color-active,#dde4f0)'" onblur="this.style.borderColor='var(--ui-border,rgba(255,255,255,0.12))'"></textarea>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px;">
          <span style="font-size:0.55rem; color:var(--ui-color-dim,rgba(200,210,230,0.55)); line-height:1.5;">Context (URL, active vibe, viewport) is attached automatically.</span>
          <button id="report-submit" style="padding:6px 16px; background:transparent; border:1px solid var(--ui-color-active,#dde4f0); border-radius:var(--ui-radius,6px); color:var(--ui-color-active,#dde4f0); font-family:inherit; font-size:0.62rem; letter-spacing:0.06em; cursor:pointer; white-space:nowrap; flex-shrink:0; transition:background 0.15s;">Send report →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
