name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Pull to server
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        run: git -C ${{ vars.DEPLOY_PATH }} pull origin main

      - name: Rebuild and recreate container
        run: docker compose -f /home/eddie/docker/gis/docker-compose.yml up -d --build map-tile-interceptor

      - name: Purge Cloudflare edge cache
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_ZONE_ID / CF_API_TOKEN not set; skipping cache purge"
            exit 0
          fi
          resp=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"hosts":["tiles.eddielathamjones.com"]}')
          echo "$resp" | grep -q '"success":true' || { echo "::warning::Cache purge failed: $resp"; exit 1; }
          echo "Purged tiles.eddielathamjones.com"

      - name: Confirm
        run: |
          echo "Deployed at $(date)"
          echo "HEAD: $(git -C ${{ vars.DEPLOY_PATH }} rev-parse --short HEAD)"
